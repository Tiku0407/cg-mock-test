name: Publish Manual Secure Set

on:
  push:
    branches: [main]
    paths:
      - "sets/public-set*.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-secure-set
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Add newest secure set to app
        run: python tools/add_public_server_set.py
      - name: Commit updated app
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "CGSSB Manual Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Publish secure manual mock set"
          git push origin main
